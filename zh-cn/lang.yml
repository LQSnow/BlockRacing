rule-book:
  title: "&b方块竞速规则"
  author: "&7BlockRacing"
  pages:
    - "&b&l原版行为改动\n\n&0• 游戏进行时默认使用队伍聊天\n• 使用 /shout，或以 @、! 开头发送全服消息\n• /tp 只能传送到队友\n• 原版传送请使用 /teleport 或 /minecraft:tp"
    - "&b&l管理员设置\n\n&0队伍箱子数量、记录点数量和每局轮换次数均可由管理员在 config.yml 中修改。\n\n对应配置：\nmax-team-chest-num\nmax-team-waypoint-num\nmax-roll-count"
    - "&b&l基本规则\n\n&0两个队伍需要收集记分板显示的目标方块。完成全部目标的队伍获胜。\n\n普通模式每次收集得 1 分，并给对方队伍箱子一组方块；竞速模式目标相同且不会赠送方块。极速模式每次得 3 分。"
    - "&b&l菜单功能\n\n&0Shift+F 打开菜单。\n\n队伍箱子：共享物资\n记录点：保存和传送\n轮换：全队在线玩家同意后替换目标\n定位：花费积分购买\n随机传送：首次免费\n极速补给：5 积分"
    - "&b&l常用指令 1/2\n\n&0/language 切换语言\n/randomteam 随机分队\n/block <red|blue> <编号> 查询完整目标名\n/tp <玩家> 传送到队友\n/shout <消息> 全服聊天"
    - "&b&l常用指令 2/2\n\n&0/menu 打开菜单\n/waypoint remove <编号> 删除记录点\n/locatebiome <群系>\n/locatestructure <结构>\n/restartgame 全员投票重置游戏"

