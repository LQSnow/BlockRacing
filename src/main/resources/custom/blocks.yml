nether:
  unlock-percent: 25
end:
  unlock-percent: 70

# Optional tier progression for local files; disabled unless explicitly enabled here.
# Progress uses completed goals, not generated queue positions. Order is T1 through T6.
# Zero blocks a tier; positive values multiply the preset's base tier weights.
tier-progression:
  enabled: false
  stages:
    - start-percent: 0
      tier-multipliers: [8, 3, 0, 0, 0, 0]
    - start-percent: 15
      tier-multipliers: [4, 4, 1, 0, 0, 0]
    - start-percent: 35
      tier-multipliers: [2, 3, 4, 1, 0, 0]
    - start-percent: 60
      tier-multipliers: [1, 2, 4, 3, 1, 0]
    - start-percent: 80
      tier-multipliers: [1, 1, 2, 4, 4, 2]
