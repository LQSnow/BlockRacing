# Local custom block list. Each ID may occur only once across this file.
# Only reviewed survival block items are allowed. Omitted tiers/dimensions are empty.
# This file chooses the pool in Local mode; GUI tier/dimension toggles are ignored.
# Local mode ignores the GUI copper toggle and thresholds; set unlock-percent per dimension here.
# Example pool: 70 Overworld blocks. Edit while in preparation, then click Local to reload.
overworld:
  unlock-percent: 0
  tier-1:
    - minecraft:andesite
    - minecraft:birch_log
    - minecraft:birch_planks
    - minecraft:birch_sapling
    - minecraft:birch_wood
    - minecraft:chest
    - minecraft:cobblestone
    - minecraft:crafting_table
    - minecraft:diorite
    - minecraft:dirt
    - minecraft:granite
    - minecraft:gravel
    - minecraft:ladder
    - minecraft:lever
    - minecraft:oak_log
    - minecraft:oak_planks
    - minecraft:oak_sapling
    - minecraft:oak_wood
    - minecraft:sand
    - minecraft:spruce_log
    - minecraft:spruce_planks
    - minecraft:spruce_sapling
    - minecraft:spruce_wood
    - minecraft:torch
  tier-2:
    - minecraft:activator_rail
    - minecraft:andesite_slab
    - minecraft:andesite_stairs
    - minecraft:andesite_wall
    - minecraft:barrel
    - minecraft:birch_button
