    waypoints-lore: "&bSave or teleport to waypoints"
    random-tp: "&9Random Teleport"
    random-tp-lore:
      - "&bSpend 2 points to &lrandomly teleport&r&b"
      - "&bin the &lOverworld&r&b, first time is free"
    current-blocks: "&6Current Target Blocks"
    current-blocks-lore:
      - "&bShow every currently visible target"
      - "&bfor both teams in chat"
    teammate-teleport: "&aTeleport to Teammate"
    teammate-teleport-lore:
      - "&bChoose an online teammate to teleport to"
      - "&7You can also use /tp <player>"
    supply: "&6Buy Team Supplies &8- &e5 Points"
    supply-lore:
      - "&7Give every online teammate:"
      - "&616 Golden Carrots &8+ &f32 Firework Rockets"
      - "&7Items drop at their feet if inventories are full"
  teammate-teleport:
    title: "&0Teleport to Teammate"
    player-lore:
      - "&aClick to teleport to this teammate"
    empty: "&cNo Online Teammates"
    empty-lore:
      - "&7Online teammates will appear here"
  team-chest-select-menu:
    title: "&0Team Chest Selection"
    chest: "&bTeam Chest "
  team-chest:
    red-chest: "&cRed Team Chest "
    blue-chest: "&9Blue Team Chest "
  way-point:
    title: "&0Waypoints"
    empty:
      waypoint: "&dWaypoint "
      lore: "&bLeft-click to create a waypoint"
    filled:
      waypoint: "&6Waypoint "
      lore:
        - "&aDimension: %dimension%"
        - "&aCoordinates: %coords%"
        - "&aBiome: %biome%"
        - "&bLeft-click to teleport, right-click to delete"
        - "&bDeleting waypoints requires confirmation in the chat"
  all:
    return-back: "&cReturn"

rule-book:
  title: "&bBlock Racing Rules"
  author: "&7BlockRacing"
  pages:
    - "&b&lVanilla Changes\n\n&0• Chat is team-only while a game is active\n• Use /shout or start with @ or ! for global chat\n• /tp only targets teammates\n• Use /teleport or /minecraft:tp for the vanilla command"
    - "&b&lAdmin Settings\n\n&0Team chest count, waypoint count and rerolls per game can be changed in config.yml.\n\nKeys:\nmax-team-chest-num\nmax-team-waypoint-num\nmax-roll-count"
    - "&b&lCore Rules\n\n&0Both teams collect the target blocks shown on the scoreboard.\n\nThe first team to complete every target wins."
    - "&b&lModes & Scoring\n\n&0Normal: 1 point and a stack sent to the opponent.\n\nRacing: shared targets, with no item gifts.\n\nSpeed: 3 points per target."
    - "&b&lMenu Features\n\n&0Press Shift+F for the menu.\n\nTeam Chest: shared items\nWaypoints: save/teleport\nReroll: online team vote\nLocate: costs points\nRandom TP: first use free\nSpeed Supplies: 5 points"
    - "&b&lCommands 1/2\n\n&0/language change language\n/randomteam balance teams\n/block <red|blue> <index> show a full target name\n/tp <player> teammate teleport\n/shout <message> global chat"
    - "&b&lCommands 2/2\n\n&0/menu open menu\n/waypoint remove <index>\n/locatebiome <biome>\n/locatestructure <structure>\n/restartgame vote to reset"

