# BlockRacing English language file
# This file contains player-facing text except Minecraft block names.
# Translation guide in this repository: docs/en/TranslationTutorial-en.md
# Player preferences are changed with /language; this value identifies this file.
lang: en_us

# Scoreboard
# An empty quoted value hides the line; a single space creates a blank line.
# Keep lines concise because Minecraft clients have limited sidebar width.
scoreboard:
  game-mode:
    normal: "&aNormal"
    racing: "&3Racing"
    speed: "&9Speed"
  blocks:
    easy: "&aEZ"
    medium: "&eMID"
    hard: "&cHARD"
    dyed: "&dDYED"
    end: "&eEND"
  pregame:
    title: "&b&lBlock Racing"
    slot11: ""
    slot10: "&b&lShift+F &fto open the menu"
    slot9: ""
    slot8: ""
    slot7: " "
    slot6: "&7Mode &f%game_mode%"
    slot5: "&7Targets &f%block_amount%"
    slot4: "&7Difficulty &f%blocks%"
    slot3: ""
    slot2: " "
    slot1: "&7/language &8> &bLanguage"
  ingame:
    title: "&b&lBlock Racing"
    red-score: "&cRed &e%score% pts &8(%current_block%/%total_block%)"
    blue-score: "&9Blue &e%score% pts &8(%current_block%/%total_block%)"
    block-format: "&8[%difficulty%&8] &f%block%"
    dividing-line: "&8&m--------------------------------"
    bottom-slot: ""
    block-difficulty:
      easy: "&aEASY"
      medium: "&eMID"
      hard: "&cHARD"
      nightmare: "&5NIGHTMARE"
      dyed: "&dDYED"
      end: "&eEND"

# Team
team:
  red:
    name: "&cRed Team"
    prefix: "&c[Red]"
    chat: "&8[&aTeam&8] &c%s&7: &f%s"
    color: "&c"
  blue:
    name: "&9Blue Team"
    prefix: "&9[Blue]"
    chat: "&8[&aTeam&8] &9%s&7: &f%s"
